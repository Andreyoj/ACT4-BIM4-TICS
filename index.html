<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Catálogo de productos consultado desde una API pública." />
    <title>Mercado | Catálogo de productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Mercado, inicio">
        <span class="brand-mark">M</span>
        <span>mercado</span>
      </a>
      <span class="header-note">Catálogo abierto / 2026</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">Selección diaria</p>
          <h1 id="page-title">Encuentra algo <em>bueno.</em></h1>
          <p class="hero-text">Explora productos reales consultados en tiempo real y filtra el catálogo a tu ritmo.</p>
        </div>
        <div class="hero-stamp" aria-hidden="true">
          <span>API</span>
          <strong>LIVE</strong>
          <span>●</span>
        </div>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="toolbar">
          <div>
            <p class="eyebrow">Catálogo</p>
            <h2 id="catalog-title">Productos destacados</h2>
          </div>
          <label class="search-box" for="search-input">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="Buscar productos..." autocomplete="off" />
          </label>
        </div>

        <div class="catalog-meta">
          <p id="results-count" aria-live="polite">Cargando productos...</p>
          <button id="reload-button" class="reload-button" type="button">
            <span aria-hidden="true">↻</span> Actualizar
          </button>
        </div>

        <div id="status" class="status" role="status">Conectando con la API...</div>
        <div id="products-grid" class="products-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Mercado / práctica frontend</span>
      <span>Datos: DummyJSON</span>
    </footer>
  </body>
</html>
